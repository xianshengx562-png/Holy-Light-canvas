<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#38BDF8;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#0EA5E9;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0284C7;stop-opacity:0.3"/>
    </radialGradient>
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#38BDF8;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#38BDF8;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6EE7B7;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#38BDF8;stop-opacity:0.9"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 外层光晕 -->
  <circle cx="256" cy="256" r="200" fill="url(#auraGlow)"/>
  
  <!-- 连接线网络 -->
  <g stroke="#38BDF8" stroke-width="2" opacity="0.4" stroke-linecap="round">
    <line x1="256" y1="256" x2="256" y2="140"/>
    <line x1="256" y1="256" x2="372" y2="256"/>
    <line x1="256" y1="256" x2="140" y2="256"/>
    <line x1="256" y1="256" x2="340" y2="172"/>
    <line x1="256" y1="256" x2="172" y2="340"/>
    <line x1="256" y1="256" x2="172" y2="172"/>
    <line x1="256" y1="256" x2="340" y2="340"/>
    <line x1="256" y1="256" x2="256" y2="372"/>
  </g>
  
  <!-- 次级连接线 -->
  <g stroke="#38BDF8" stroke-width="1.5" opacity="0.25" stroke-linecap="round">
    <line x1="256" y1="140" x2="340" y2="172"/>
    <line x1="340" y1="172" x2="372" y2="256"/>
    <line x1="372" y1="256" x2="340" y2="340"/>
    <line x1="340" y1="340" x2="256" y2="372"/>
    <line x1="256" y1="372" x2="172" y2="340"/>
    <line x1="172" y1="340" x2="140" y2="256"/>
    <line x1="140" y1="256" x2="172" y2="172"/>
    <line x1="172" y1="172" x2="256" y2="140"/>
  </g>
  
  <!-- 外围节点 -->
  <g filter="url(#softGlow)">
    <circle cx="256" cy="140" r="10" fill="url(#nodeGradient)" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="372" cy="256" r="10" fill="url(#nodeGradient)" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="140" cy="256" r="10" fill="url(#nodeGradient)" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="340" cy="172" r="8" fill="url(#nodeGradient)" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="172" cy="340" r="8" fill="url(#nodeGradient)" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="172" cy="172" r="8" fill="url(#nodeGradient)" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="340" cy="340" r="8" fill="url(#nodeGradient)" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="256" cy="372" r="10" fill="url(#nodeGradient)" stroke="#38BDF8" stroke-width="2"/>
  </g>
  
  <!-- 中心核心 - 发光的圣光源 -->
  <g filter="url(#softGlow)">
    <circle cx="256" cy="256" r="45" fill="url(#coreGlow)" opacity="0.9"/>
    <circle cx="256" cy="256" r="32" fill="#38BDF8" opacity="0.95"/>
    <circle cx="256" cy="256" r="20" fill="#E0F2FE"/>
    
    <!-- 中心光芒线条 -->
    <g stroke="#E0F2FE" stroke-width="3" opacity="0.8" stroke-linecap="round">
      <line x1="256" y1="236" x2="256" y2="220"/>
      <line x1="276" y1="256" x2="292" y2="256"/>
      <line x1="256" y1="276" x2="256" y2="292"/>
      <line x1="236" y1="256" x2="220" y2="256"/>
    </g>
  </g>
</svg>
