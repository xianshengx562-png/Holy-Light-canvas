<!doctype html>
<html lang="zh-CN" data-theme="dark" data-theme-mode="dark" data-nav="expanded">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Holy Light画布 — AI 创作空间</title>
    <!--
      启动画面（2026-09-26）。

      ⚠️ 这一段**必须内联**：它要在 2MB 的 JS bundle 还在解析的时候就已经画在屏幕上 ——
         那正是「窗口出来了、界面还是空的」那一段。等 bundle 跑起来再画就晚了。
      ⚠️ 牌子是**延迟 180ms 才亮**（下面 `REVEAL_MS`）：热启动两三百毫秒就好了，
         那种情况下它压根不出现 ——「需要加载才加载」。
      ⚠️ 撤牌子有两道兜底，缺一不可：`BootGate` 的 2500ms（某一页没问会话时接手），
         以及下面这段内联脚本的 6000ms —— 连 JS 整个挂掉它也照撤，不会把人堵死。
      ⚠️ 颜色走 globals 的令牌（`--bg` / `--accent` 随 `data-theme` 变），
         兜底深色与 `electron/main/index.ts` 的 `backgroundColor` 一致。
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 12px;
        background: var(--bg, #0b0b0f);
        color: var(--text, #e8eaed);
        opacity: 0;
        transition: opacity 220ms ease, background-color 200ms linear;
      }
      #boot.on { opacity: 1; }
      /* 特异性 (1,1,1) 压得住 `#boot.on` 的 (1,1,0) —— 不用 !important。 */
      html[data-boot='done'] #boot { opacity: 0; pointer-events: none; }
      /* 启动画面上的软件 logo（2026-09-29）。
         ⚠️ 这一串 data URI 是**生成**的（`FRAME\_make-logo.py`），和
            `src/assets/logo.png` 同源 —— 换 logo 换那张图再跑脚本，别手改这一行。
         ⚠️ 必须内联：它要在 2MB 的 bundle 还在解析的时候就已经画在屏幕上。 */
      #boot-mark {
        width: 88px;
        height: 88px;
        /* 先"长出来"一次，然后极轻地呼吸 —— 呼吸幅度只有 4%，盯着看才知道它在动。 */
        animation: boot-mark-in 420ms cubic-bezier(0.4, 0, 0.2, 1) backwards,
                   boot-breathe 2.6s ease-in-out 420ms infinite;
      }
      html[data-theme='dark'] #boot-mark { filter: invert(1); }
      @keyframes boot-mark-in {
        from { opacity: 0; transform: scale(0.92); }
        to { opacity: 1; transform: none; }
      }
      @keyframes boot-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.04); }
      }
      #boot-name { font-size: 13px; letter-spacing: 4px; color: var(--text-dim, #9aa1a8); }
      #boot-tip { font-size: 11px; color: var(--text-mute, #6b737a); }
      #boot-bar {
        width: 168px;
        height: 2px;
        margin-top: 4px;
        background: var(--line, rgba(255, 255, 255, 0.14));
        border-radius: 999px;
        overflow: hidden;
      }
      #boot-bar > i {
        display: block;
        width: 42%;
        height: 100%;
        background: var(--accent, #4fb389);
        border-radius: 999px;
        animation: boot-slide 1.15s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(340%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-bar > i { animation: none; width: 100%; }
        #boot-mark { animation: none; }
      }
    </style>
  </head>

    <div id="root"></div>
    <div id="boot" role="status" aria-live="polite">

    <script>
      (function () {
        var root = document.documentElement;
        var el = document.getElementById('boot');
        var REVEAL_MS = 180;     /* 这么久还没好才亮出来 —— 快机器不闪一下没用的牌子 */
        var HARD_STOP_MS = 6000; /* 硬兜底：连 JS 都挂了也照撤 */
        var done = false;
        window.__frameBootReady = function () {
          if (done) return;
          done = true;
          root.setAttribute('data-boot', 'done');
          /* 等淡出走完再摘，别在半透明的时候突然消失。 */
          window.setTimeout(function () {
            if (el && el.parentNode) el.parentNode.removeChild(el);
          }, 400);
        };
        window.setTimeout(function () {
          if (!done) el.className = 'on';
        }, REVEAL_MS);
        window.setTimeout(function () { window.__frameBootReady(); }, HARD_STOP_MS);
      })();
    </script>
    <script type="module" src="/main.tsx"></script>
  </body>
